name: Fix derper hostname

on:
  workflow_dispatch:
  push:
    branches:
      - source-backup
    paths:
      - ".github/workflows/fix-derper.yml"

jobs:
  fix-derper:
    name: Switch derper to relay.mzaxd.fun
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose derper on bj
        env:
          SSH_KEY: ${{ secrets.BJ_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 47.93.100.194 >> ~/.ssh/known_hosts 2>/dev/null
          ssh root@47.93.100.194 'bash -s' << 'EOF'
          echo "=== derper recent log ==="
          journalctl -u derper --since "30 min ago" --no-pager | tail -25
          echo "=== stability test x5 ==="
          for i in 1 2 3 4 5; do curl -sk -o /dev/null -w "try$i HTTP %{http_code} in %{time_total}s\n" --resolve relay.mzaxd.fun:443:127.0.0.1 https://relay.mzaxd.fun/generate_204; done
          echo "=== external test ==="
          curl -sk -o /dev/null -w "relay HTTP %{http_code} in %{time_total}s\n" --max-time 15 https://relay.mzaxd.fun/generate_204
          EOF
