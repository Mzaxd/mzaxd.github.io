name: Fix derper hostname

on:
  workflow_dispatch:
  push:
    branches:
      - source-backup
    paths:
      - ".github/workflows/fix-derper.yml"

jobs:
  fix-derper:
    name: Switch derper to relay.mzaxd.fun
    runs-on: ubuntu-latest
    steps:
      - name: Fix derper hostname on bj
        env:
          SSH_KEY: ${{ secrets.BJ_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 47.93.100.194 >> ~/.ssh/known_hosts 2>/dev/null
          ssh root@47.93.100.194 'bash -s' << 'EOF'
          sed -i 's|-hostname derp-cn.mzaxd.fun|-hostname relay.mzaxd.fun|' /etc/systemd/system/derper.service
          systemctl daemon-reload
          systemctl restart derper
          sleep 2
          echo "service: $(systemctl is-active derper)"
          grep ExecStart /etc/systemd/system/derper.service
          echo | openssl s_client -connect 127.0.0.1:8443 -servername relay.mzaxd.fun 2>/dev/null | grep subject=
          curl -sk -o /dev/null -w "relay HTTP %{http_code}\n" --resolve relay.mzaxd.fun:443:127.0.0.1 https://relay.mzaxd.fun/generate_204
          curl -s -o /dev/null -w "blog HTTP %{http_code}\n" https://mzaxd.fun/
          EOF
