name: Blog CI/CD

# 触发条件：push 到 source-backup 分支（Hexo 源码分支）
on:
  push:
    branches:
      - source-backup

env:
  TZ: Asia/Shanghai

jobs:
  blog-cicd:
    name: Hexo build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install hexo dependencies
        run: |
          npm install -g hexo-cli
          npm ci || npm install

      - name: Generate files
        run: |
          hexo clean
          hexo generate

      - name: Push to GitHub Pages (master)
        env:
          GITHUB_REPO: github.com/Mzaxd/mzaxd.github.io
        run: |
          cd ./public && git init && git add .
          git config user.name "Mzaxd"
          git config user.email "caihaohan0712@foxmail.com"
          git commit -m "GitHub Actions Auto Builder at $(date +'%Y-%m-%d %H:%M:%S')"
          git push --force --quiet "https://${{ secrets.ACCESS_TOKEN }}@$GITHUB_REPO" master:master

      - name: Deploy to bj server
        env:
          SSH_KEY: ${{ secrets.BJ_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BJ_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete ./public/ root@47.93.100.194:/var/www/blog/
